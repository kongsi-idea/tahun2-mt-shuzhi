<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苹果果园数学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://kongsi-idea.vercel.app/data/track-use.js" data-slug="tahun2-mt-shuzhi" defer></script>
<meta property="og:type" content="website">
<meta property="og:title" content="苹果果园数学">
<meta property="og:description" content="用苹果、篮子、箱子和推车看懂千位、百位、十位、个位：加一个苹果满 10 个就装篮进位，还有数位与数值、数目分析的单人挑战和四人竞赛。">
<meta property="og:image" content="https://tahun2-mt-shuzhi.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="900">
<meta property="og:url" content="https://tahun2-mt-shuzhi.vercel.app">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

<div id="splash"><img src="assets/cover.jpg" alt="苹果果园数学"></div>

<header class="top">
  <div class="brand"><img src="assets/apple.webp" alt=""><h1>苹果果园数学</h1></div>
  <nav class="tabs" aria-label="模式">
    <button id="tab-learn" class="tab on" type="button">学习模式</button>
    <button id="tab-comp" class="tab" type="button">四人竞赛</button>
  </nav>
  <button id="helpBtn" class="help" type="button" aria-label="再看一次引导">？</button>
</header>

<main id="app">

  <!-- 学习模式 -->
  <section id="mode-learn">
    <div class="panel controls">
      <label for="numIn">输入数字</label>
      <input id="numIn" type="number" inputmode="numeric" min="0" max="1000" value="219">
      <button id="showBtn" class="btn green" type="button">展示果园</button>
      <button id="rndBtn" class="btn yellow" type="button">随机数字</button>
      <span class="hint">0 到 1000</span>
    </div>

    <div class="lower">
      <div class="panel digits">
        <div class="dlabel">点数字，看它的数位和数值</div>
        <div id="cards" class="cards"></div>
        <div id="bubble" class="bubble" hidden></div>
      </div>
      <div class="panel analysis">
        <h3>分析</h3>
        <p id="an1"></p>
        <p id="an2"></p>
      </div>
    </div>

    <div id="orchard" class="orchard"></div>

    <section id="solo" class="panel solo">
      <h2>单人挑战</h2>
      <div id="soloStartArea" class="solo-start">
        <p>一轮 10 题，每题选一个答案。</p>
        <button id="soloStart" class="btn orange big" type="button">出题考考我</button>
      </div>
      <div id="soloQArea" hidden>
        <div class="q-progress"><span id="soloNo"></span><span id="soloScore"></span></div>
        <div id="soloVisual" class="q-visual" hidden></div>
        <p id="soloStem" class="q-stem"></p>
        <div id="soloOpts" class="opts"></div>
        <div id="soloFb" class="q-fb" aria-live="polite"></div>
        <button id="soloNext" class="btn blue big" type="button" hidden>下一题</button>
      </div>
      <div id="soloEnd" class="solo-end" hidden>
        <p class="end-score" id="soloEndScore"></p>
        <p class="stars" id="soloStars"></p>
        <button id="soloAgain" class="btn orange big" type="button">再来一轮</button>
      </div>
    </section>
  </section>

  <!-- 四人竞赛 -->
  <section id="mode-comp" hidden>
    <div class="comp-bar">
      <button id="compStart" class="btn orange big" type="button">开始新一轮</button>
      <span class="hint">每人答 5 题，答对越多排越前面</span>
    </div>
    <div id="compGrid" class="comp-grid"></div>
  </section>
</main>

<!-- 放大视图 -->
<div id="zoom" class="zoom" hidden>
  <div class="zoom-inner">
    <div id="zoomStage" class="zoom-stage"></div>
    <p id="zoomCap" class="zoom-cap"></p>
    <p class="zoom-close">点画面任意处关闭</p>
  </div>
</div>

<!-- 颁奖 -->
<div id="awards" class="modal" hidden>
  <div class="modal-box">
    <h2>比赛结束</h2>
    <div id="awardList" class="award-list"></div>
    <button id="awardAgain" class="btn green big" type="button">再来一局</button>
  </div>
</div>

<!-- 引导 -->
<div id="gLayer" class="g-layer" hidden>
  <div class="g-ring"></div>
  <svg class="g-hand" viewBox="0 0 64 80" aria-hidden="true">
    <path d="M27 5c-4 0-7 3-7 7v31l-5-4c-3-2-7-2-9 1-2 2-1 5 1 7l16 21c3 4 7 6 12 6h11c9 0 13-6 13-15V37c0-3-2-5-5-5s-4 2-4 3c0-3-2-5-5-5-2 0-4 1-4 3 0-3-2-5-5-5-1 0-3 0-4 1V12c0-4-3-7-5-7z" fill="#FFD9B0" stroke="#7A4A22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 38v14M48 40v12M32 38v12" stroke="#7A4A22" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/>
  </svg>
  <div class="g-bubble"><p class="g-text"></p><div class="g-btns"><button class="g-ok" type="button" hidden>好</button><button class="g-skip" type="button">跳过</button></div></div>
</div>

<script src="app.js"></script>
<script src="preview.js"></script>
</body>
</html>
